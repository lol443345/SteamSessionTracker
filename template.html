<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steam Session Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f8;--card:#fff;--tx:#161a26;--mu:#6b7287;--bd:#e2e5ee;--ac:#5b6cff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--card:#171a26;--tx:#eceef7;--mu:#8b92a8;--bd:#262b3d;--ac:#7c8bff}}
:root[data-theme="dark"]{--bg:#0d0f17;--card:#171a26;--tx:#eceef7;--mu:#8b92a8;--bd:#262b3d;--ac:#7c8bff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;padding:20px}
.w{max-width:1100px;margin:auto}
h1{margin:0 0 4px;font-size:28px;background:linear-gradient(90deg,var(--ac),#ff6bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
#drop{border:2px dashed var(--bd);text-align:center;padding:26px;cursor:pointer;transition:.2s}
#drop.o,#drop:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card))}
textarea{width:100%;height:70px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:12px monospace;margin-top:10px}
button,select,input{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--mu)}
.stats{display:grid;gap:16px;margin-bottom:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.stat b{display:block;font-size:26px;margin-top:2px}.stat span{color:var(--mu);font-size:13px}
.g{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g .card{margin:0}h3{margin:0 0 10px;font-size:15px;color:var(--mu);font-weight:600}
.ch{position:relative;height:280px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{height:6px;border-radius:3px;background:var(--bd);min-width:80px}.bar i{display:block;height:100%;border-radius:3px}
#res{display:none}.g>.card:last-child{grid-column:1/-1}
@media(min-width:720px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1092px){.g{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}.fh{display:flex;justify-content:space-between;align-items:center;position:relative;margin-bottom:6px}.fh h3{margin:0}
#fb,#gfb{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 8px;line-height:0}#fb:hover,#fb.on,#gfb:hover,#gfb.on{color:var(--ac);border-color:var(--ac)}
#fp,#gfp{position:absolute;right:0;top:38px;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;min-width:210px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}#fp[hidden],#gfp[hidden]{display:none}
#fp label,#gfp label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}#fp label:hover,#gfp label:hover{background:var(--bg)}
#fp input,#gfp input{padding:0;background:none;accent-color:var(--ac);width:15px;height:15px;margin:0}#fp .dot,#gfp .dot{margin:0}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--tx)}.arr{display:inline-block;width:14px;margin-left:4px;font-size:10px;color:var(--ac)}.live #ta,.live #hint{display:none}.live #drop{padding:12px;cursor:default;border-style:solid}
</style></head><body><div class="w">
<h1>🎮 Steam Session Tracker</h1>
<p class="s">Updates automatically every few seconds while Steam runs. Everything runs locally in your browser.</p>
<div class="card" id="drop"><span id="hint">📂 Click or drop a log file here</span>
<input type="file" id="f" accept=".txt,.log" hidden>
<textarea id="ta" placeholder="…or paste log text here" onclick="event.stopPropagation()"></textarea>
<div class="row" onclick="event.stopPropagation()">
<label>Ignore sessions shorter than <select id="min" onchange="go()"><option value="0">0 s</option><option value="60" selected>1 min</option><option value="300">5 min</option></select></label>
<button onclick="go()">Analyze</button></div></div>
<div id="res">
<div class="stats" id="stats"></div>
<div class="g">
<div class="card"><h3>Time per game</h3><div class="ch"><canvas id="c1"></canvas></div></div>
<div class="card"><h3>Hours per day</h3><div class="ch"><canvas id="c2"></canvas></div></div>
<div class="card"><h3>When you play (hour of day)</h3><div class="ch"><canvas id="c3"></canvas></div></div>
<div class="card"><div class="fh"><h3>Games</h3><button id="gfb" title="Filter games"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4z"/></svg></button><div id="gfp" hidden></div></div><div class="tw" id="gt"></div></div>
</div>
<div class="card" style="margin-top:16px"><div class="fh"><h3>Sessions</h3><button id="fb" title="Filter games"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4z"/></svg></button><div id="fp" hidden></div></div><div class="tw" id="st"></div></div>
</div></div>
<script>
const LIVE=/*__LIVE__*/false;
const PAL=['#7c8bff','#ff6bd6','#35d0ba','#ffb84d','#ff6b6b','#8ce05c','#4db8ff','#c084fc'];
const KNOWN={730:'Counter-Strike 2',244210:'Assetto Corsa',227300:'Euro Truck Simulator 2',1172470:'Apex Legends'};
let names={};try{names=JSON.parse(localStorage.getItem('n')||'{}')}catch(e){}
const nm=id=>names[id]||KNOWN[id]||'App '+id;
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m?m+'m':s+'s'};
const pad=n=>String(n).padStart(2,'0');
let charts=[],last='',SS=[],COL={},sk='s',sd=-1,hide=new Set(),fkey='';
const kv={g:x=>nm(x.id).toLowerCase(),s:x=>+x.s,e:x=>+x.e,d:x=>x.e-x.s};
function srt(k){if(sk===k)sd=-sd;else{sk=k;sd=k==='g'?1:-1}tbl()}
function tbl(){
 const rows=SS.filter(x=>!hide.has(x.id)).sort((a,b)=>{const A=kv[sk](a),B=kv[sk](b);return(A>B?1:A<B?-1:0)*sd||b.s-a.s});
 const th=(k,l)=>`<th class="sort" onclick="srt('${k}')">${l}<span class="arr">${sk===k?(sd>0?'▲':'▼'):''}</span></th>`;
 document.getElementById('st').innerHTML='<table><tr>'+th('g','Game')+th('s','Start')+th('e','End')+th('d','Duration')+'</tr>'+rows.map(x=>`<tr><td><span class="dot" style="background:${COL[x.id]}"></span>${nm(x.id)}</td><td>${x.s.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</td><td>${x.open?(LIVE?'now':'(log ended)'):x.e.toLocaleTimeString([], {timeStyle:'short'})}</td><td>${fmt((x.e-x.s)/1e3)}</td></tr>`).join('')+'</table>';
 document.getElementById('fb').classList.toggle('on',hide.size>0)}
function fpop(ids){const k=ids.join();if(k===fkey)return;fkey=k;document.getElementById('fp').innerHTML=ids.map(i=>`<label><input type="checkbox" ${hide.has(i)?'':'checked'} onchange="tg('${i}')"><span class="dot" style="background:${COL[i]}"></span>${nm(i)}</label>`).join('')}
function tg(i){hide.has(i)?hide.delete(i):hide.add(i);tbl()}
let GD={ids:[],tot:{},cnt:{},mx:1},gk='t',gd=-1,ghide=new Set(),gkey='';
const gv={g:i=>nm(i).toLowerCase(),t:i=>GD.tot[i],c:i=>GD.cnt[i]};
function gsrt(k){if(gk===k)gd=-gd;else{gk=k;gd=k==='g'?1:-1}gtbl()}
function gtbl(){
 const rows=GD.ids.filter(i=>!ghide.has(i)).sort((a,b)=>{const A=gv[gk](a),B=gv[gk](b);return(A>B?1:A<B?-1:0)*gd||GD.tot[b]-GD.tot[a]});
 const th=(k,l)=>`<th class="sort" onclick="gsrt('${k}')">${l}<span class="arr">${gk===k?(gd>0?'▲':'▼'):''}</span></th>`;
 document.getElementById('gt').innerHTML='<table><tr>'+th('g','Game')+th('t','Time')+th('c','Sessions')+'<th></th></tr>'+rows.map(i=>`<tr><td><span class="dot" style="background:${COL[i]}"></span><a href="#" style="color:var(--tx)" onclick="ren('${i}');return false">${nm(i)}</a></td><td>${fmt(GD.tot[i])}</td><td>${GD.cnt[i]}</td><td><div class="bar"><i style="width:${GD.tot[i]/GD.mx*100}%;background:${COL[i]}"></i></div></td></tr>`).join('')+'</table>';
 document.getElementById('gfb').classList.toggle('on',ghide.size>0)}
function gpop(){const k=GD.ids.join();if(k!==gkey){gkey=k;document.getElementById('gfp').innerHTML=GD.ids.map(i=>`<label><input type="checkbox" data-id="${i}" onchange="gtg('${i}')"><span class="dot" style="background:${COL[i]}"></span>${nm(i)}</label>`).join('')}
 document.querySelectorAll('#gfp input').forEach(e=>e.checked=!ghide.has(e.dataset.id))}
function gtg(i){ghide.has(i)?ghide.delete(i):ghide.add(i);render(ALL)}
function parse(t){
 const re=/^\[(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)\](?:\[[\d.]+\])? Game Recording - (?:would start recording game (\d+)|game stopped \[gameid=(\d+)\])/;
 const cv=/^\[\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\] Client version/;const open={},out=[];let end=null;
 for(const l of t.split(/\r?\n/)){if(cv.test(l)){for(const id in open){out.push({id,s:open[id],e:end});delete open[id]}continue}const m=re.exec(l);if(!m)continue;
  const d=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]);end=d;
  if(m[7]){if(!open[m[7]])open[m[7]]=d}
  else if(open[m[8]]){out.push({id:m[8],s:open[m[8]],e:d});delete open[m[8]]}}
 for(const id in open)out.push({id,s:open[id],e:LIVE?new Date():end,open:true});
 return out.sort((a,b)=>a.s-b.s);}
function go(){
 const t=document.getElementById('ta').value;if(!t.trim())return;last=t;
 const min=+document.getElementById('min').value;
 const ss=parse(t).filter(x=>(x.e-x.s)/1e3>=min);
 if(!ss.length){if(!LIVE)alert('No sessions found in that log.');return}
 render(ss)}
let ALL=[],ORDER=[],CH={},TOT={};
function render(ss){
 ALL=ss;TOT={};
 document.getElementById('res').style.display='block';
 const tot=TOT,cnt={},days={},hrs=Array(24).fill(0),dset=new Set(),vt={};
 let all=0,longest=null,nv=0;
 ss.forEach(x=>{const d=(x.e-x.s)/1e3,v=!ghide.has(x.id);
  tot[x.id]=(tot[x.id]||0)+d;cnt[x.id]=(cnt[x.id]||0)+1;
  if(v){nv++;all+=d;vt[x.id]=(vt[x.id]||0)+d;if(!longest||d>(longest.e-longest.s)/1e3)longest=x}
  let c=x.s.getTime();const E=x.e.getTime();
  while(c<E){const n=new Date(c);const nx=new Date(n.getFullYear(),n.getMonth(),n.getDate(),n.getHours()+1).getTime();const seg=(Math.min(nx,E)-c)/1e3;
   const k=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());(days[k]=days[k]||{})[x.id]=((days[k]||{})[x.id]||0)+seg;
   if(v){hrs[n.getHours()]+=seg;dset.add(k)}c=Math.min(nx,E)}});
 const ids=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
 ids.forEach(i=>{if(!ORDER.includes(i))ORDER.push(i)});
 const col={};ORDER.forEach((id,i)=>col[id]=PAL[i%PAL.length]);
 const dk=Object.keys(days).sort();
 const now=LIVE&&ss.find(x=>x.open&&!ghide.has(x.id));
 const top=Object.keys(vt).sort((a,b)=>vt[b]-vt[a])[0],D='—';
 document.getElementById('stats').innerHTML=[
  ['Total playtime',nv?fmt(all):D],['Sessions',nv],['Avg session',nv?fmt(all/nv):D],
  ['Longest session',longest?fmt((longest.e-longest.s)/1e3)+' · '+nm(longest.id):D],
  [now?'🟢 Playing now':'Most played',now?nm(now.id):top?nm(top):D],['Days played',dset.size]]
  .map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');
 if(!CH.c1){
  const cs=getComputedStyle(document.documentElement),gc=cs.getPropertyValue('--bd').trim(),ax={grid:{color:gc}};
  Chart.defaults.color=cs.getPropertyValue('--mu').trim();Chart.defaults.borderColor=gc;
  Chart.defaults.animation.duration=650;Chart.defaults.animation.easing='easeInOutCubic';
  CH.c1=new Chart(c1,{type:'doughnut',data:{labels:[],datasets:[{data:[],backgroundColor:[],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'65%',plugins:{legend:{onClick:(e,it)=>gtg(ORDER[it.index]),labels:{filter:it=>ORDER[it.index] in TOT}},tooltip:{callbacks:{label:c=>c.label+': '+fmt(c.raw*3600)}}}}});
  CH.c2=new Chart(c2,{type:'bar',data:{labels:[],datasets:[]},options:{maintainAspectRatio:false,plugins:{legend:{onClick:(e,it)=>gtg(ORDER[it.datasetIndex]),labels:{filter:it=>ORDER[it.datasetIndex] in TOT}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,...ax,title:{display:true,text:'hours'}}}}});
  CH.c3=new Chart(c3,{type:'bar',data:{labels:hrs.map((_,i)=>pad(i)),datasets:[{label:'hours',data:Array(24).fill(0),backgroundColor:'#7c8bff',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:ax}}});
 }
 const hv=id=>ghide.has(id)||!(id in tot);
 const d1=CH.c1.data;d1.labels=ORDER.map(nm);d1.datasets[0].data=ORDER.map(i=>+((tot[i]||0)/3600).toFixed(2));d1.datasets[0].backgroundColor=ORDER.map(i=>col[i]);
 ORDER.forEach((i,k)=>{if(CH.c1.getDataVisibility(k)===hv(i))CH.c1.toggleDataVisibility(k)});
 const d2=CH.c2.data;d2.labels=dk.map(k=>k.slice(5));
 ORDER.forEach((i,k)=>{const d={label:nm(i),data:dk.map(q=>+(((days[q]||{})[i]||0)/3600).toFixed(2)),backgroundColor:col[i],borderRadius:4};
  if(d2.datasets[k])Object.assign(d2.datasets[k],d);else d2.datasets.push(d)});
 ORDER.forEach((i,k)=>CH.c2.setDatasetVisibility(k,!hv(i)));
 CH.c3.data.datasets[0].data=hrs.map(h=>+(h/3600).toFixed(2));
 CH.c1.update();CH.c2.update();CH.c3.update();
 COL=col;GD={ids,tot,cnt,mx:tot[ids[0]]};gpop();gtbl();
 SS=ss;fpop(ids);tbl()}
function ren(id){const n=prompt('Name for app '+id+':',nm(id));if(n){fkey='';gkey='';names[id]=n;try{localStorage.setItem('n',JSON.stringify(names))}catch(e){}if(LIVE)pywebview.api.set_names(names);go()}}
let seen='';
async function poll(){try{const t=await pywebview.api.get_log();if(t!==seen||parse(t).some(x=>x.open)){seen=t;document.getElementById('ta').value=t;go()}}catch(e){}}
if(LIVE){document.body.classList.add('live');window.addEventListener('pywebviewready',async()=>{try{names=await pywebview.api.get_names()}catch(e){}poll();setInterval(poll,5000)})}
const pops=[['fb','fp'],['gfb','gfp']].map(([b,p])=>[document.getElementById(b),document.getElementById(p)]);
pops.forEach(([b,p])=>b.onclick=e=>{e.stopPropagation();const h=p.hidden;pops.forEach(x=>x[1].hidden=true);p.hidden=!h});
document.addEventListener('click',e=>pops.forEach(([b,p])=>{if(!p.contains(e.target))p.hidden=true}));
const drop=document.getElementById('drop'),fi=document.getElementById('f');
function rd(file){const r=new FileReader();r.onload=()=>{document.getElementById('ta').value=r.result;go()};r.readAsText(file)}
drop.onclick=()=>!LIVE&&fi.click();fi.onchange=()=>fi.files[0]&&rd(fi.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('o')};drop.ondragleave=()=>drop.classList.remove('o');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('o');e.dataTransfer.files[0]&&rd(e.dataTransfer.files[0])};
</script></body></html>
